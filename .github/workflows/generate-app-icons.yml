name: Publicar iconos 3D Judi's Shop
on:
  push:
    paths:
      - 'public/js-logo-3d.svg'
      - 'scripts/generate-app-icons.py'
      - '.github/workflows/generate-app-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iconos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/generate-app-icons.py
      - name: Guardar iconos en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/favicon.ico public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Publica iconos PNG 3D para instalar Judi's Shop"
            git push
          fi
